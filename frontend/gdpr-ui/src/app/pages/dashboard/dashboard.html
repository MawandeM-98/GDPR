<h1 class="text-3xl font-bold text-gray-800 mb-6">Dashboard</h1>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
  <div class="bg-white p-6 rounded-lg shadow-md">
    <h3 class="text-lg font-semibold text-gray-600">Total Requests</h3>
    <p class="text-3xl font-bold text-gray-800">142</p>
  </div>
  <div class="bg-white p-6 rounded-lg shadow-md">
    <h3 class="text-lg font-semibold text-gray-600">Pending Requests</h3>
    <p class="text-3xl font-bold text-yellow-500">12</p>
  </div>
  <div class="bg-white p-6 rounded-lg shadow-md">
    <h3 class="text-lg font-semibold text-gray-600">Resolved Requests</h3>
    <p class="text-3xl font-bold text-green-500">119</p>
  </div>
  <div class="bg-white p-6 rounded-lg shadow-md">
    <h3 class="text-lg font-semibold text-gray-600">Compliance Score</h3>
    <p class="text-3xl font-bold text-blue-500">89%</p>
  </div>
</div>

<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
  <div class="bg-white p-6 rounded-lg shadow-md">
    <h3 class="text-xl font-semibold text-gray-700 mb-4">Request Types</h3>
    <div class="relative h-[300px]">
      <canvas #requestTypesCanvas id="requestTypesCanvas"></canvas>
    </div>
  </div>

  <div class="bg-white p-6 rounded-lg shadow-md">
    <h3 class="text-xl font-semibold text-gray-700 mb-4">Consent Statistics</h3>
    <div class="relative h-[300px]">
      <canvas #consentCanvas id="consentCanvas"></canvas>
    </div>
  </div>
</div>
