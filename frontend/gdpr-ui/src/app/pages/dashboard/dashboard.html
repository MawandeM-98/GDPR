<main class="ml-64 p-8">
  <h1 class="text-3xl font-bold text-gray-800 mb-6">Dashboard</h1>

  <!-- Include the dashboard cards component -->
  <app-dashboard-cards></app-dashboard-cards>

  <!-- Charts Section -->
  <div class="mt-8 grid grid-cols-1 lg:grid-cols-2 gap-8">
    <!-- Request Types Chart -->
    <div class="bg-white p-6 rounded-lg shadow-md">
      <h3 class="text-xl font-semibold text-gray-700 mb-4">Request Types</h3>
      <div class="relative h-64"><canvas id="requestTypesChart"></canvas></div>
    </div>

    <!-- Consent Statistics Chart -->
    <div class="bg-white p-6 rounded-lg shadow-md">
      <h3 class="text-xl font-semibold text-gray-700 mb-4">Consent Statistics</h3>
      <div class="relative h-64"><canvas id="consentStatsChart"></canvas></div>
    </div>
  </div>
</main>
